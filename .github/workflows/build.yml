name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@v1
      - name: Run tests
        run: sbt clean +test 'scripted sbt1only/*' '+scripted sbt-dotenv/*'
      - name: Check JNA dependency with sbt 2.1.0-RC1
        run: >-
          sbt
          '++3.8.4'
          'set scriptedSbt := "2.1.0-RC1"'
          'scripted sbt-dotenv/check-jna-dep'
